name: ML-HW02 Basic checks
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.ipynb'
      - '!.github/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hw02-basic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  basic:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node.js 24
        with:
          python-version: '3.12'
      - name: 提出ファイルの形式確認（内容の正しさは確認しません）
        run: python .github/scripts/preflight.py
